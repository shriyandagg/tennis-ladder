<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tennis Ladder</title>
</head>

<body>
    <h1>Tennis Ladder</h1>

    <p>
        <a href="/challenges/new">Request a Challenge</a>
        |
        <a href="/coach">Coach Dashboard</a>
    </p>

    <h2>Current Rankings</h2>

    <ol>
        <li th:each="player : ${players}">
            <span th:text="${player.name}"></span>
        </li>
    </ol>

    <p>
        <a href="/players/new">Add Player</a>
    </p>

    <h2>Active Challenges</h2>

    <p th:if="${activeChallenges.isEmpty()}">
        There are no active challenges.
    </p>

    <div th:each="challenge : ${activeChallenges}">
        <p>
            <strong th:text="${challenge.challenger.name}"></strong>
            challenged
            <strong th:text="${challenge.opponent.name}"></strong>
            —
            <span th:text="${challenge.status}"></span>
        </p>
    </div>

    <h2>Match History</h2>

    <p th:if="${matchHistory.isEmpty()}">
        No matches have been completed.
    </p>

    <div th:each="challenge : ${matchHistory}">
        <p>
            <strong th:text="${challenge.challenger.name}"></strong>
            vs.
            <strong th:text="${challenge.opponent.name}"></strong>
        </p>

        <p>
            Winner:
            <strong th:text="${challenge.winner.name}"></strong>
        </p>

        <p>
            Score:
            <span th:text="${challenge.score}"></span>
        </p>

        <hr>
    </div>
</body>
</html>

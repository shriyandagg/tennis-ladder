<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <nav class="navbar">
        <div class="nav-content">
            <a class="brand" href="/">Tennis Ladder</a>

            <div class="nav-links">
                <a href="/">Player Dashboard</a>
                <a href="/challenges/new">Request Challenge</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="hero">
            <h1>Coach Dashboard</h1>
            <p>
                Review challenge requests and record match results.
            </p>
        </section>

        <section class="card">
            <div class="section-header">
                <h2>Challenge Management</h2>
            </div>

            <p class="empty-message"
               th:if="${challenges.isEmpty()}">
                There are no challenge requests.
            </p>

            <div class="challenge-item"
                 th:each="challenge : ${challenges}">

                <p class="challenge-title">
                    <span th:text="${challenge.challenger.name}"></span>
                    challenged
                    <span th:text="${challenge.opponent.name}"></span>
                </p>

                <p>
                    <span class="status"
                          th:text="${challenge.status}">
                    </span>
                </p>

                <div class="action-row"
                     th:if="${challenge.status.name()
                            == 'PENDING_COACH_APPROVAL'}">

                    <form
                        th:action="@{/challenges/{id}/approve(
                            id=${challenge.id})}"
                        method="post">

                        <button class="button" type="submit">
                            Approve
                        </button>
                    </form>

                    <form
                        th:action="@{/challenges/{id}/reject(
                            id=${challenge.id})}"
                        method="post">

                        <button class="button button-danger" type="submit">
                            Reject
                        </button>
                    </form>
                </div>

                <div th:if="${challenge.status.name() == 'APPROVED'}">
                    <p class="match-details">
                        Approved—the players may arrange their match.
                    </p>

                    <a class="button"
                       th:href="@{/challenges/{id}/result(
                            id=${challenge.id})}">
                        Enter Result
                    </a>
                </div>

                <div th:if="${challenge.status.name() == 'REJECTED'}">
                    <p class="match-details">
                        This request was rejected.
                    </p>
                </div>

                <div th:if="${challenge.status.name() == 'COMPLETED'}">
                    <p class="match-details">
                        Winner:
                        <strong th:text="${challenge.winner.name}"></strong>
                        · Score:
                        <strong th:text="${challenge.score}"></strong>
                    </p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>

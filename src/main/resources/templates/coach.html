<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Coach Dashboard</title>
</head>

<body>
    <h1>Coach Dashboard</h1>

    <p>
        <a href="/">Go to Player View</a>
    </p>

    <h2>Challenge Requests</h2>

    <p th:if="${challenges.isEmpty()}">
        There are no challenge requests.
    </p>

    <div th:each="challenge : ${challenges}">
        <h3>
            <span th:text="${challenge.challenger.name}"></span>
            challenged
            <span th:text="${challenge.opponent.name}"></span>
        </h3>

        <p>
            Status:
            <strong th:text="${challenge.status}"></strong>
        </p>

        <div th:if="${challenge.status.name()
                == 'PENDING_COACH_APPROVAL'}">

            <form
                th:action="@{/challenges/{id}/approve(id=${challenge.id})}"
                method="post">
                <button type="submit">Approve</button>
            </form>

            <form
                th:action="@{/challenges/{id}/reject(id=${challenge.id})}"
                method="post">
                <button type="submit">Reject</button>
            </form>
        </div>

        <div th:if="${challenge.status.name() == 'APPROVED'}">
            <p>
                The players may now arrange and play their match.
            </p>

            <a
                th:href="@{/challenges/{id}/result(id=${challenge.id})}">
                Enter Match Result
            </a>
        </div>

        <div th:if="${challenge.status.name() == 'REJECTED'}">
            <p>This challenge was rejected.</p>
        </div>

        <div th:if="${challenge.status.name() == 'COMPLETED'}">
            <p>
                Winner:
                <strong th:text="${challenge.winner.name}"></strong>
            </p>

            <p>
                Score:
                <span th:text="${challenge.score}"></span>
            </p>
        </div>

        <hr>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Match Result</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <nav class="navbar">
        <div class="nav-content">
            <a class="brand" href="/">Tennis Ladder</a>

            <div class="nav-links">
                <a href="/">Player Dashboard</a>
                <a href="/coach">Coach Dashboard</a>
                <form class="logout-form"
      th:action="@{/logout}"
      method="post">
    <button class="logout-button" type="submit">
        Log Out
    </button>
</form>
            </div>
        </div>
    </nav>

    <main class="form-card card">
        <h1>Record Match Result</h1>

        <p class="challenge-title">
            <span th:text="${challenge.challenger.name}"></span>
            vs.
            <span th:text="${challenge.opponent.name}"></span>
        </p>

        <form
            th:action="@{/challenges/{id}/result(
                id=${challenge.id})}"
            method="post">

            <div class="form-group">
                <label for="winnerId">Winner</label>

                <select id="winnerId"
                        name="winnerId"
                        required>
                    <option value="">Select the winner</option>

                    <option
                        th:value="${challenge.challenger.id}"
                        th:text="${challenge.challenger.name}">
                    </option>

                    <option
                        th:value="${challenge.opponent.id}"
                        th:text="${challenge.opponent.name}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="score">Final score</label>

                <input id="score"
                       name="score"
                       type="text"
                       placeholder="Example: 6-4 6-3"
                       required>
            </div>

            <div class="action-row">
                <button class="button" type="submit">
                    Save Result
                </button>

                <a class="button button-secondary" href="/coach">
                    Cancel
                </a>
            </div>
        </form>
    </main>
</body>
</html>

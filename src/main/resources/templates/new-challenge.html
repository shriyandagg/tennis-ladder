<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Challenge</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <nav class="navbar">
        <div class="nav-content">
            <a class="brand" href="/">Tennis Ladder</a>

            <div class="nav-links">
                <a href="/">Player Dashboard</a>
                <a href="/coach">Coach Dashboard</a>
            </div>
        </div>
    </nav>

    <main class="form-card card">
        <h1>Request a Challenge</h1>

        <p class="match-details">
            You may challenge someone ranked up to three positions above you.
        </p>

        <p class="error-message"
           th:if="${error}"
           th:text="${error}">
        </p>

        <form action="/challenges" method="post">
            <div class="form-group">
                <label for="challengerId">Your name</label>

                <select id="challengerId"
                        name="challengerId"
                        required>
                    <option value="">Select a player</option>

                    <option
                        th:each="player : ${players}"
                        th:value="${player.id}"
                        th:text="${player.ladderPosition
                                + '. ' + player.name}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="opponentId">Opponent</label>

                <select id="opponentId"
                        name="opponentId"
                        required>
                    <option value="">Select an opponent</option>

                    <option
                        th:each="player : ${players}"
                        th:value="${player.id}"
                        th:text="${player.ladderPosition
                                + '. ' + player.name}">
                    </option>
                </select>
            </div>

            <div class="action-row">
                <button class="button" type="submit">
                    Send Request to Coach
                </button>

                <a class="button button-secondary" href="/">
                    Cancel
                </a>
            </div>
        </form>
    </main>
</body>
</html>
